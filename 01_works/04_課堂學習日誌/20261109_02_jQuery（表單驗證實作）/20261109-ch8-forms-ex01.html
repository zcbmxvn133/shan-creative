<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ch8. 表單 Forms - 補習班課程資料收集</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/myall.css">
</head>

<body>
  <div class="container pb-5">
    <div class="course-title">XX補習班課程資料收集</div>
    <div class="row justify-content-center">
      <div class="col-md-8">
        <form id="courseForm" novalidate>
          <div class="mb-3">
            <label for="username" class="form-label">姓名</label>
            <input type="text" class="form-control form-control-lg" id="username" placeholder="姓名字數1~6字。">
            <div class="valid-feedback">姓名符合規定</div>
            <div class="invalid-feedback">姓名不符合規定</div>
          </div>
          <div class="mb-3">
            <label for="nickname" class="form-label">暱稱</label>
            <input type="text" class="form-control form-control-lg" id="nickname" placeholder="請填入暱稱，字數2~8個。">
            <div class="valid-feedback">暱稱符合規定</div>
            <div class="invalid-feedback">暱稱不符合規定</div>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="請填入email，字數5~10個。">
            <div class="valid-feedback">email符合規定</div>
            <div class="invalid-feedback">email不符合規定</div>
          </div>
          <div class="mb-3">
            <label for="myclass" class="form-label">最有興趣的課程</label>
            <input type="text" class="form-control form-control-lg" id="myclass" list="classList"
              placeholder="請填入最有興趣的課程，字數2~8個。">
            <datalist id="classList">
              <option value="PHP"></option>
              <option value="JavaScript"></option>
              <option value="Python"></option>
              <option value="MySQL"></option>
            </datalist>
          </div>
          <div class="text-end mt-4">
            <button type="button" id="cancel_btn" class="btn btn-outline-secondary">取消</button>
            <button type="button" id="ok_btn" class="btn btn-primary">確認</button>
          </div>
        </form>
      </div>
      <div class="col-md-8 confirm-panel" aria-live="polite">
        <div class="confirm-title">課程資料收集確認</div>
        <div id="showmessage" class="confirm-values">
          <div class="h2">姓名：xxx</div>
          <div class="h2">暱稱：xxx</div>
          <div class="h2">Email：xxx</div>
          <div class="h2">最有興趣的課程：xxx</div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/main.js"></script>
</body>

</html>
